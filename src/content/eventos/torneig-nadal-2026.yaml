# normas: pendientes de Montca (A-26). Mientras no estén, el apartado no sale.
# Preguntas: el texto en valenciano tal cual de docs/info-montca.md.
preguntas:
  - pregunta: { ca: "Què inclou la inscripció?", es: "¿Qué incluye la inscripción?" }
    respuesta:
      ca: "La participació de l'equip en el torneig i en les tres modalitats esportives."
      es: "La participación del equipo en el torneo y en las tres modalidades deportivas."
  - pregunta: { ca: "Hi haurà premis?", es: "¿Habrá premios?" }
    respuesta:
      ca: "Sí. Els premis s'anunciaran pròximament a través de les nostres xarxes socials."
      es: "Sí. Los premios se anunciarán próximamente a través de nuestras redes sociales."
  - pregunta: { ca: "Com puc contactar amb l'organització?", es: "¿Cómo puedo contactar con la organización?" }
    respuesta:
      ca: "A través del correu electrònic, les nostres xarxes socials o per telèfon al 722 79 60 66."
      es: "A través del correo electrónico, nuestras redes sociales o por teléfono al 722 79 60 66."
  - pregunta: { ca: "Què passa si el meu equip no arriba al mínim de jugadors?", es: "¿Qué pasa si mi equipo no llega al mínimo de jugadores?" }
    respuesta:
      ca: "La inscripció quedarà pendent fins que complete el nombre mínim de jugadors."
      es: "La inscripción quedará pendiente hasta que complete el número mínimo de jugadores."
  - pregunta: { ca: "Quan se celebra el torneig?", es: "¿Cuándo se celebra el torneo?" }
    respuesta:
      ca: "Els dies 27 de desembre de 2026 i 3 de gener de 2027."
      es: "Los días 27 de diciembre de 2026 y 3 de enero de 2027."
  - pregunta: { ca: "On se celebra?", es: "¿Dónde se celebra?" }
    respuesta:
      ca: "Al Poliesportiu Municipal de Cocentaina."
      es: "En el Polideportivo Municipal de Cocentaina."
